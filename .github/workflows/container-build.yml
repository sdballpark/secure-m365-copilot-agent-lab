name: Container Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build SecureLab API image
        run: docker build --tag secure-m365-copilot-agent-lab:ci .

      - name: Verify image runs as non-root
        run: |
          USER_ID=$(docker run --rm --entrypoint id secure-m365-copilot-agent-lab:ci -u)
          test "$USER_ID" != "0"
