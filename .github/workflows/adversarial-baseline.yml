name: Adversarial Baseline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  control-plane-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run measured control-plane baseline
        run: python -m evaluations.run_control_plane_eval --check

      - name: Run evaluation tests
        run: pytest -q tests/test_evaluation.py

      - name: Upload baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-baseline
          path: evaluations/results/
