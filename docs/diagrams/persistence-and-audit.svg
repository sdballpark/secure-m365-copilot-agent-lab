<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="white"/><style>.t{font:700 28px Arial;fill:#0f172a}.h{font:700 18px Arial;fill:#0f172a}.b{font:15px Arial;fill:#334155}.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.sec{fill:#eef2ff;stroke:#4338ca;stroke-width:2}.data{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.ctrl{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.arr{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><text x="40" y="48" class="t">Persistence and Tamper-Evident Audit</text><rect x="60" y="110" width="250" height="100" rx="12" class="ctrl"/><text x="105" y="150" class="h">Application API</text><text x="95" y="180" class="b">State-changing event</text><rect x="390" y="110" width="270" height="100" rx="12" class="data"/><text x="455" y="150" class="h">PostgreSQL</text><text x="420" y="180" class="b">Incidents • approvals • state</text><rect x="750" y="110" width="350" height="100" rx="12" class="sec"/><text x="830" y="150" class="h">Audit Events</text><text x="785" y="180" class="b">sequence • prev_hash • event_hash</text><rect x="390" y="330" width="270" height="100" rx="12" class="box"/><text x="430" y="370" class="h">Advisory Lock</text><text x="420" y="400" class="b">Serialize chain append</text><rect x="750" y="330" width="350" height="100" rx="12" class="warn"/><text x="820" y="370" class="h">GET /audit/verify</text><text x="790" y="400" class="b">Independent approver control plane</text><rect x="750" y="520" width="350" height="90" rx="12" class="box"/><text x="830" y="558" class="h">Production Direction</text><text x="785" y="585" class="b">Export to immutable external log store</text><path d="M310 160 H390 M660 160 H750 M525 210 V330 M660 380 H750 M925 430 V520" class="arr"/></svg>